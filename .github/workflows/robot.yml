# Vezoria — robot de tests à chaque envoi sur GitHub (gratuit pour un dépôt public)
# 1. vérifie que chaque fichier JavaScript se lit sans erreur de syntaxe
# 2. ouvre l'appli dans un Chromium de téléphone et touche les boutons de chaque écran (tests/robot.mjs)
# Un ❌ rouge dans l'onglet « Actions » = une erreur à corriger avant de déployer.
name: Robot de tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntaxe des fichiers JavaScript
        run: |
          for f in public/sw.js public/i18n.js public/lang/*.js public/assets/*.js; do node --check "$f"; done
          for f in $(find functions -name '*.js'); do node --input-type=module --check < "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.json','utf8'))"
          node -e "
            const h=require('fs').readFileSync('public/index.html','utf8');const re=/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g;let m,n=0;
            while((m=re.exec(h))){n++;new Function(m[1]);}console.log(n+' scripts de index.html : OK');"
      - name: Installer Playwright
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Robot (français et anglais)
        run: node tests/robot.mjs
        env:
          LANGS: fr,en
