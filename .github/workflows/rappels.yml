# Vezoria — envoie les rappels programmés à l'heure, même si personne n'ouvre l'appli.
# Sans ce fichier, les rappels ne partent qu'à l'occasion d'une synchro (un appel sur 12 environ).
# Toutes les 30 minutes (dépôt public : minutes GitHub illimitées).
# Une erreur passagère (Cloudflare, réseau) est réessayée 4 fois avant de compter comme un échec.
name: Rappels
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Envoyer les rappels arrivés à l'heure
        run: |
          curl -sS --fail-with-body --max-time 30 --retry 4 --retry-delay 15 --retry-all-errors \
            "https://vezoria.pages.dev/api/push?a=flush"
          echo
