# Vezoria — envoie les rappels programmés à l'heure, même si personne n'ouvre l'appli.
# Sans ce fichier, les rappels ne partent qu'à l'occasion d'une synchro (un appel sur 12 environ).
# Toutes les 30 minutes (≈ 1 500 minutes GitHub par mois, sous les 2 000 gratuites d'un dépôt privé ;
# dépôt public : illimité, tu peux passer à '*/10 * * * *').
name: Rappels
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Envoyer les rappels arrivés à l'heure
        run: curl -fsS --max-time 30 "https://vezoria.pages.dev/api/push?a=flush"
