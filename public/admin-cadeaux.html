<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vezoria · Cadeaux</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b18;--mut:#6b665e;--line:#e4dfd5;--acc:#6a4cff;--ok:#1f8a5b;--bad:#c0392b}
  @media (prefers-color-scheme:dark){:root{--bg:#151412;--card:#201e1b;--ink:#f1ede6;--mut:#a39d93;--line:#34312c;--acc:#9d87ff;--ok:#4cc38a;--bad:#ff7b6b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,sans-serif;padding:16px}
  main{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:4px 0 14px}
  h2{font-size:16px;margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit}
  button{margin-top:10px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 15px/1 inherit;cursor:pointer}
  button.sec{background:transparent;color:var(--acc);border:1px solid var(--line)}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .code{font:700 20px/1.3 ui-monospace,Menlo,monospace;letter-spacing:1px;text-align:center;padding:10px;border:1px dashed var(--acc);border-radius:10px;margin-top:10px;user-select:all}
  .msg{font-size:14px;margin-top:8px;color:var(--mut);white-space:pre-wrap}
  .g{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .g small{color:var(--mut)} .g button{width:auto;margin:0;padding:6px 10px;font-size:13px}
  .err{color:var(--bad)} .okc{color:var(--ok)}
</style>
</head>
<body>
<main>
  <h1>🎁 Vezoria · codes cadeaux</h1>
  <div class="card">
    <label for="k">Clé d’administration (ADMIN_KEY)</label>
    <input id="k" type="password" autocomplete="off">
    <div class="msg">Gardée seulement le temps de cet onglet.</div>
  </div>

  <div class="card">
    <h2>Créer un code cadeau</h2>
    <div class="row">
      <div><label for="plan">Formule</label><select id="plan"><option value="unlimited">Illimité (famille)</option><option value="plus">Plus</option><option value="max">Max</option></select></div>
      <div><label for="days">Durée</label><select id="days"><option value="0">Pour toujours</option><option value="30">1 mois</option><option value="365">1 an</option></select></div>
    </div>
    <div class="row">
      <div><label for="uses">Utilisations</label><input id="uses" type="number" min="0" value="1"></div>
      <div><label for="note">Pour qui (note)</label><input id="note" placeholder="Maman"></div>
    </div>
    <button onclick="mk()">Créer le code</button>
    <div id="out"></div>
  </div>

  <div class="card">
    <h2>Donner une formule à un carnet</h2>
    <label for="cc">Code administrateur du carnet (calculé ici, jamais envoyé)</label>
    <input id="cc" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off">
    <div class="row">
      <div><label for="pplan">Formule</label><select id="pplan"><option value="unlimited">Illimité</option><option value="plus">Plus</option><option value="max">Max</option><option value="free">Retirer (gratuit)</option></select></div>
      <div><label for="pdays">Durée</label><select id="pdays"><option value="0">Pour toujours</option><option value="30">1 mois</option><option value="365">1 an</option></select></div>
    </div>
    <div class="row"><button class="sec" onclick="look()">Voir</button><button onclick="give()">Appliquer</button></div>
    <div class="msg" id="pout"></div>
  </div>

  <div class="card">
    <h2>Codes créés</h2>
    <button class="sec" onclick="list()">Afficher</button>
    <div id="gl"></div>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  try { $('k').value = sessionStorage.getItem('vz-ak') || ''; } catch (e) {}
  $('k').addEventListener('change', () => { try { sessionStorage.setItem('vz-ak', $('k').value); } catch (e) {} });
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  async function api(body) {
    const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': $('k').value }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ('erreur ' + r.status)); return j;
  }
  // même empreinte que l’appli (PBKDF2, 200 000 tours) : le code du carnet ne quitte jamais cette page
  async function tokenOf(code) {
    const te = new TextEncoder(), base = await crypto.subtle.importKey('raw', te.encode(code.trim().toUpperCase()), 'PBKDF2', false, ['deriveBits']);
    const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: te.encode('carnet-voyage/space/v2'), iterations: 200000, hash: 'SHA-256' }, base, 256);
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  const planTxt = p => ({ unlimited: 'Illimité', plus: 'Plus', max: 'Max' }[p] || p || 'Gratuit');
  async function mk() {
    $('out').innerHTML = '<div class="msg">…</div>';
    try {
      const j = await api({ action: 'giftCreate', plan: $('plan').value, days: +$('days').value, uses: +$('uses').value, note: $('note').value });
      $('out').innerHTML = `<div class="code">${esc(j.code)}</div><div class="msg">${planTxt(j.plan)} · ${j.days ? j.days + ' jours' : 'pour toujours'} · ${j.uses || 'utilisations illimitées'}\nÀ taper dans l’appli : ☁️ Cloud → 🎁 J’ai un code cadeau.\nNote-le maintenant : il ne sera plus affiché.</div><button class="sec" onclick="navigator.clipboard.writeText('${esc(j.code)}')">📋 Copier</button>`;
    } catch (e) { $('out').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  }
  async function look(apply) {
    $('pout').textContent = '… calcul de l’empreinte';
    try {
      const token = await tokenOf($('cc').value);
      const j = await api(apply ? { action: 'planSet', token, plan: $('pplan').value, days: +$('pdays').value } : { action: 'planLook', token });
      $('pout').innerHTML = `<span class="okc">${apply ? '✓ Appliqué' : 'Carnet ' + esc(j.owner)}</span>\n${j.usedMb} Mo utilisés sur ${j.quotaMb} Mo · ${planTxt(j.active ? j.plan : '')}${j.until ? ' jusqu’au ' + new Date(j.until).toLocaleDateString('fr-FR') : ''} · ${j.kids} voyage(s) branché(s)${j.branch ? '\n(code d’un voyage : on montre le carnet de son créateur)' : ''}`;
    } catch (e) { $('pout').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  }
  const give = () => look(true);
  async function list() {
    $('gl').innerHTML = '<div class="msg">…</div>';
    try {
      const j = await api({ action: 'giftList' });
      $('gl').innerHTML = (j.gifts || []).map(g => `<div class="g"><span><b>${planTxt(g.plan)}</b> · ${esc(g.note || '—')}<br><small>${g.days ? g.days + ' j' : 'toujours'} · ${g.used}/${g.uses || '∞'} · ${new Date(g.created).toLocaleDateString('fr-FR')}${g.revoked ? ' · retiré' : ''}</small></span>${g.revoked ? '' : `<button class="sec" onclick="rv('${g.id}')">Retirer</button>`}</div>`).join('') || '<div class="msg">Aucun code.</div>';
    } catch (e) { $('gl').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  }
  async function rv(id) { try { await api({ action: 'giftRevoke', id }); list(); } catch (e) { alert(e.message); } }
</script>
</body>
</html>
