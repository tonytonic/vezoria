<script>/* Filet de sécurité : jamais d’écran vide sans explication (JavaScript ancien exprès) */
(function(){
  var errs = [], shown = false, old = false;   // « old » : testé par le petit script suivant (pas de new Function : interdit par la CSP)
  window.addEventListener('error', function(e){ if (errs.length < 3) errs.push((e.message || 'erreur') + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function(e){ if (errs.length < 3) errs.push('promesse : ' + (e.reason && e.reason.message || e.reason)); });
  function chrome(){ var m = navigator.userAgent.match(/Chrome\/(\d+)/); return m ? 'Chrome ' + m[1] : ''; }
  function show(){
    if (shown || window.__vzReady) return; shown = true;
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;inset:0;top:0;left:0;right:0;bottom:0;z-index:2147483647;background:#2A1238;color:#fff;font:15px/1.5 -apple-system,Roboto,sans-serif;padding:40px 22px;overflow:auto;text-align:left');
    var info = (old ? 'Navigateur trop ancien / browser too old. ' : '') + chrome() + ' · ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 160) + (errs.length ? ' · ' + errs.join(' | ') : '');
    d.innerHTML = '<div style="max-width:460px;margin:0 auto"><div style="font-size:40px">🧭</div>'
      + '<h1 style="font-size:20px;margin:8px 0 10px">Vezoria n’arrive pas à démarrer</h1>'
      + '<p style="margin:0 0 12px;opacity:.9">' + (old ? 'Le navigateur de ce téléphone est trop ancien pour Vezoria.' : 'Le chargement a échoué sur ce téléphone.') + '</p>'
      + '<ol style="margin:0 0 16px;padding-left:20px;opacity:.9"><li>Play Store : mets à jour <b>Google Chrome</b> et <b>Android System WebView</b> (et active Chrome s’il est désactivé).</li>'
      + '<li>Vérifie ta connexion Internet.</li><li>Touche « Réparer » ci-dessous.</li></ol>'
      + '<button id="vz-boot-re" style="font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:12px;background:#a855f7;color:#fff;margin:0 8px 8px 0">Réessayer</button>'
      + '<button id="vz-boot-fix" style="font:inherit;padding:12px 18px;border:1px solid rgba(255,255,255,.5);border-radius:12px;background:transparent;color:#fff;margin:0 0 8px">Réparer</button>'
      + '<p style="margin:14px 0 4px;font-size:13px;opacity:.75">Can’t start Vezoria: update Google Chrome and Android System WebView from the Play Store, check your connection, then tap “Réparer” (repair).</p>'
      + '<p style="margin:12px 0 0;font-size:11px;opacity:.55;word-break:break-word">Info : <span id="vz-boot-info"></span></p></div>';
    (document.body || document.documentElement).appendChild(d);
    document.getElementById('vz-boot-info').textContent = info;
    document.getElementById('vz-boot-re').onclick = function(){ location.reload(); };
    document.getElementById('vz-boot-fix').onclick = function(){
      var jobs = [];   // on vide seulement le cache de l’appli (fichiers du site), jamais les voyages
      try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); } catch (e) {}
      try { if (window.caches) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); } catch (e) {}
      Promise.all(jobs).then(function(){ location.reload(); }, function(){ location.reload(); });
    };
  }
  window.__vzBootFail = show;
  document.addEventListener('DOMContentLoaded', function(){ if (!window.__vzES2020) { old = true; show(); } });
  setTimeout(show, 8000);
})();
</script>

<script>/* 🐞 erreurs des vrais téléphones, anonymes : message, fichier:ligne, version, navigateur et système. Jamais de données de voyage. */
(function(){
  if (!/^https?:$/.test(location.protocol) || /^(localhost|127\.|192\.168\.)/.test(location.hostname)) return;
  var sent = {}, n = 0;
  function plat(){ var u = navigator.userAgent, m;
    var os = (m = u.match(/OS (\d+)[_.](\d+)[^)]*like Mac OS X/)) ? 'iOS ' + m[1] + '.' + m[2] : (m = u.match(/Android (\d+(?:\.\d+)?)/)) ? 'Android ' + m[1] : /Windows/.test(u) ? 'Windows' : /Mac OS X/.test(u) ? 'macOS' : /Linux/.test(u) ? 'Linux' : '?';
    var br = (m = u.match(/SamsungBrowser\/(\d+)/)) ? 'Samsung ' + m[1] : (m = u.match(/(?:CriOS|Chrome)\/(\d+)/)) ? (/; wv\)/.test(u) ? 'WebView ' : 'Chrome ') + m[1] : (m = u.match(/Firefox\/(\d+)/)) ? 'Firefox ' + m[1] : (m = u.match(/Version\/(\d+(?:\.\d+)?).*Safari/)) ? 'Safari ' + m[1] : /AppleWebKit/.test(u) ? 'WebKit' : '?';
    var mode = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone ? ' · appli' : ' · web';
    return os + ' · ' + br + mode; }
  function send(msg, src){
    msg = String(msg || '').slice(0, 300); if (!msg || /^Script error\.?$|ResizeObserver loop|Load failed$|NetworkError|Failed to fetch|AbortError|The operation was aborted/i.test(msg)) return;
    src = String(src || '').replace(location.origin, '').slice(0, 160);
    if (src && /^(chrome|moz|safari)-extension:|^https?:/.test(src)) return;   // extensions et sites tiers : pas nos erreurs
    var k = msg + '|' + src; if (sent[k] || ++n > 5) return; sent[k] = 1;
    var body = JSON.stringify({m: msg, s: src, v: window.VZ_BUILD || '', ua: plat()});
    try { if (navigator.sendBeacon && navigator.sendBeacon('/api/err', new Blob([body], {type: 'application/json'}))) return; } catch (e) {}
    try { fetch('/api/err', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: body, keepalive: true}).catch(function(){}); } catch (e) {}
  }
  window.addEventListener('error', function(e){ if (e && e.message) send(e.message, (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0)); });
  window.addEventListener('unhandledrejection', function(e){ var r = e && e.reason; if (r && (r.stack || r.message)) send(r.message || String(r), ((r.stack || '').split('\n')[1] || '').trim()); });
  window.__vzErr = send;
})();
</script>

<script>/* iPhone (iOS 26) : sur certaines versions, l'appli installée reçoit une marge haute nulle (bug WebKit 301994) :
   le haut de la page passe sous l'heure et la batterie, et iOS y pose un flou. On mesure alors la vraie hauteur de la barre d'état. */
(function(){ function fix(){ try {
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var sa = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var root = document.documentElement; if(!ios || !sa || !document.body){ return; }
  var p = document.createElement('div'); p.style.cssText = 'position:fixed;top:0;left:0;width:1px;visibility:hidden;pointer-events:none;height:env(safe-area-inset-top,0px)';
  document.body.appendChild(p); var env = p.getBoundingClientRect().height;
  p.remove();
  if(env > 0){ root.style.removeProperty('--sat'); return; }
  // si iOS garde déjà une bande pleine pour l'heure (la page commence en dessous), il n'y a rien à compenser
  var sh = Math.max(screen.width, screen.height), ih = window.innerHeight || document.documentElement.clientHeight;
  if(sh - ih >= 20){ root.style.setProperty('--sat', '0px'); return; }
  var w = Math.min(screen.width, screen.height), h = sh;
  var t = (w >= 402 && h >= 874 && !(w === 414 && h === 896) && !(w === 428 && h === 926) && !(w === 430 && h === 932)) ? 62 : (w === 393 && h === 852) || (w === 430 && h === 932) ? 59 : (w === 390 && h === 844) || (w === 428 && h === 926) ? 47 : (w === 375 && h === 812) ? 44 : (w === 414 && h === 896) ? 48 : 20;
  root.style.setProperty('--sat', Math.round(t) + 'px');
} catch(e){} }
  document.addEventListener('DOMContentLoaded', fix); window.addEventListener('pageshow', fix);   // pas au redimensionnement : le clavier change la hauteur
})();
</script>
